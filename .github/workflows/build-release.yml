name: Build & Release Eesha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleLightningPlusDebug --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -1)
          mv "$APK_PATH" eesha-browser-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.sha }}
          name: "Eesha Browser Build ${{ github.sha }}"
          body: |
            Auto-built from commit ${{ github.sha }}
          files: |
            eesha-browser-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
