name: Build & Release Eesha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  EESHA_VERSION: "1.0.0"

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Lightning Plus - debug)
        run: ./gradlew assembleLightningPlusDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eesha-android
          path: app/build/outputs/apk/lightningPlus/debug/*.apk

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG=eesha-v${{ env.EESHA_VERSION }}

          ARTIFACT_COUNT=$(find artifacts/ -type f -name "*.apk" | wc -l)
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "No APK found!"
            exit 1
          fi

          git fetch --tags --quiet
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Deleting existing release ${RELEASE_TAG}..."
            gh release delete ${RELEASE_TAG} --yes || true
            git push origin :refs/tags/${RELEASE_TAG} --quiet || true
            git tag -d ${RELEASE_TAG} || true
          fi

          find artifacts/ -type f -name "*.apk" -print0 | xargs -0 gh release create ${RELEASE_TAG} --prerelease \
            --target main \
            --title "Eesha ${{ env.EESHA_VERSION }}" \
            --notes "Eesha Browser v${{ env.EESHA_VERSION }}

          ## Android
          - **APK**: Download and install (enable Install from unknown sources)
          - Based on Lightning Browser (MPL-2.0)
          - Default search: Eesha Search (SearXNG)"
