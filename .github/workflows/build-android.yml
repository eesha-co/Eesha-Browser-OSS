name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Eesha/android/**'
      - 'Eesha/shared/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: Eesha/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: Eesha/android
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eesha-debug-apk
          path: Eesha/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: eesha-release-apk
          path: Eesha/android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.9-android-${{ github.run_number }}
          files: |
            Eesha/android/app/build/outputs/apk/release/*.apk
            Eesha/android/app/build/outputs/apk/debug/*.apk
