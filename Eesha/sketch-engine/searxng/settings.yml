# Sketch Engine - SearXNG Configuration
# Configured to use our local OpenSearch as the primary engine
# combined with other privacy-respecting global sources.

use_default_settings: true

general:
  instance_name: "Sketch Engine"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json
    - csv
    - rss

server:
  secret_key: "sketch-engine-searxng-change-me-in-production"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true
  method: "POST"

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  center_alignment: true
  default_theme: "simple"
  theme_args:
    simple_style: "auto"

enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'
  - 'Ahmia blacklist'

# ─── Engine Configuration ────────────────────────────────────────────────
# Our local OpenSearch is the PRIMARY engine.
# Additional sources provide comprehensive results for All/Images/Videos/News.

engines:
  # ─── Our Local OpenSearch (PRIMARY) ──────────────────────────────────
  - name: sketch index
    engine: opensearch
    base_url: http://opensearch:9200
    index: nutch
    shortcut: si
    categories: [general]
    timeout: 5.0

  # ─── Web Search (General) ────────────────────────────────────────────
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]

  - name: brave
    engine: brave
    shortcut: br
    categories: [general]

  - name: qwant
    engine: qwant
    shortcut: qw
    categories: [general]

  - name: mojeek
    engine: mojeek
    shortcut: mj
    categories: [general]

  # ─── Images ──────────────────────────────────────────────────────────
  - name: duckduckgo images
    engine: duckduckgo_images
    shortcut: ddi
    categories: [images]

  - name: qwant images
    engine: qwant
    shortcut: qwi
    categories: [images]
    network: qwant

  - name: unsplash
    engine: unsplash
    shortcut: us
    categories: [images]

  - name: flickr
    engine: flickr
    shortcut: fl
    categories: [images]

  - name: pinterest
    engine: pinterest
    shortcut: pin
    categories: [images]

  # ─── Videos ──────────────────────────────────────────────────────────
  - name: duckduckgo videos
    engine: duckduckgo_videos
    shortcut: ddv
    categories: [videos]

  - name: qwant videos
    engine: qwant
    shortcut: qwv
    categories: [videos]
    network: qwant

  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    categories: [videos]

  - name: dailymotion
    engine: dailymotion
    shortcut: dm
    categories: [videos]

  - name: peertube
    engine: peertube
    shortcut: pt
    categories: [videos]

  # ─── News ────────────────────────────────────────────────────────────
  - name: duckduckgo news
    engine: duckduckgo_news
    shortcut: ddn
    categories: [news]

  - name: qwant news
    engine: qwant
    shortcut: qwn
    categories: [news]
    network: qwant

  # ─── IT / Programming ───────────────────────────────────────────────
  - name: stackoverflow
    engine: stackoverflow
    shortcut: st
    categories: [it]

  - name: github
    engine: github
    shortcut: gh
    categories: [it]

  # ─── Science / Academic ─────────────────────────────────────────────
  - name: semantic scholar
    engine: semantic_scholar
    shortcut: sem
    categories: [science]

  - name: wikidata
    engine: wikidata
    shortcut: wd
    categories: [general]

  # ─── Wikipedia ───────────────────────────────────────────────────────
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general]

  # ─── Maps ────────────────────────────────────────────────────────────
  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    categories: [maps]

  # ─── Music ───────────────────────────────────────────────────────────
  - name: bandcamp
    engine: bandcamp
    shortcut: bc
    categories: [music]

# ─── Disabled Engines (Privacy Concerns) ────────────────────────────────
disabled_engines:
  - name: google
  - name: bing
