[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# Eesha Search — 100% Independent Search Engine
# Supervisor manages all long-running processes with auto-restart.
# Bootstrap runs ONCE and exits (autorestart=false).
# Priority order determines startup sequence.
# Optimized for 512MB RAM (Render free tier).

[program:zincsearch]
command=/opt/zincsearch-bin/zincsearch
user=root
directory=/opt/zincsearch-bin
environment=ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",ZINC_DATA_PATH="/data",ZINC_SERVER_BIND="127.0.0.1:4080"
autostart=true
autorestart=true
stdout_logfile=/var/log/eesha/zincsearch.log
stderr_logfile=/var/log/eesha/zincsearch-error.log
priority=10
startsecs=3
startretries=5

[program:bootstrap]
command=/opt/eesha/bootstrap.sh
user=root
autostart=true
autorestart=false
stdout_logfile=/var/log/eesha/bootstrap.log
stderr_logfile=/var/log/eesha/bootstrap-error.log
priority=20
startsecs=0
startretries=2

[program:eesha-flask]
command=gunicorn --bind 127.0.0.1:%(ENV_FLASK_PORT)s --workers 1 --timeout 120 --chdir /opt/eesha app:app
user=root
directory=/opt/eesha
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",ZINC_SEARCH_URL="%(ENV_ZINC_SEARCH_URL)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",PORT="8888"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/eesha-flask.log
stderr_logfile=/var/log/supervisor/eesha-flask-error.log
priority=50
startsecs=5
startretries=5

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
priority=90
startsecs=2
startretries=3
