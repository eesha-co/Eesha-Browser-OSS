[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# Eesha Crawler — Crawler Instance Supervisor
# Manages all crawler processes that push data to the Search Instance.
# Each process has access to EESHA_SEARCH_URL and EESHA_API_KEY.

[program:health-server]
command=python3 /opt/eesha-crawler/health_server.py
user=root
directory=/opt/eesha-crawler
environment=PORT="%(ENV_PORT)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/health-server.log
stderr_logfile=/var/log/supervisor/health-server-error.log
priority=5
startsecs=3

[program:common-crawl]
command=python3 /opt/eesha-scripts/common_crawl_import.py --domains 10000 --limit 50000 --delay 0.3
user=root
directory=/opt/eesha-scripts
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/var/log/supervisor/common-crawl.log
stderr_logfile=/var/log/supervisor/common-crawl-error.log
priority=20

[program:wikipedia-import]
command=/opt/eesha-crawler/loop_wikipedia.sh
user=root
directory=/opt/eesha-crawler
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",WIKI_INTERVAL="21600"
autostart=true
autorestart=true
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/wikipedia-import.log
stderr_logfile=/var/log/supervisor/wikipedia-import-error.log
priority=25

[program:web-crawler]
command=python3 /opt/eesha-scripts/lightweight_crawler.py
user=root
directory=/opt/eesha-scripts
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",CRAWL_MAX_PAGES="10000",CRAWL_MAX_DEPTH="3",CRAWL_DELAY="0.5"
autostart=true
autorestart=true
startsecs=60
startretries=10
stdout_logfile=/var/log/supervisor/web-crawler.log
stderr_logfile=/var/log/supervisor/web-crawler-error.log
priority=30

[program:rss-indexer]
command=python3 /opt/eesha-scripts/rss_indexer.py
user=root
directory=/opt/eesha-scripts
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/var/log/supervisor/rss-indexer.log
stderr_logfile=/var/log/supervisor/rss-indexer-error.log
priority=35

[program:media-extractor]
command=python3 /opt/eesha-scripts/multimedia_extract.py --continuous
user=root
directory=/opt/eesha-scripts
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",EESHA_SEARCH_URL="%(ENV_EESHA_SEARCH_URL)s",EESHA_API_KEY="%(ENV_EESHA_API_KEY)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",MEDIA_SCAN_INTERVAL="1800"
autostart=true
autorestart=true
startsecs=15
startretries=10
stdout_logfile=/var/log/supervisor/media-extractor.log
stderr_logfile=/var/log/supervisor/media-extractor-error.log
priority=40
