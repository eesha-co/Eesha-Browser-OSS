# Eesha Search v2.0 — 100% Independent Search Engine
# Nginx Reverse Proxy for Hugging Face Spaces
# Port 7860 (required by HF) → Flask app (8888) + ZincSearch (4080)
# NO SearXNG — Flask app serves all search UI and API.
# Features: BM25 + Authority + Freshness + Spell Check + Knowledge Boxes + Browser-as-Crawler + RSS Indexing
# Powered by ZincSearch — single Go binary, ~256MB RAM, ES-compatible API

upstream eesha-flask {
    server 127.0.0.1:8888;
}

upstream zincsearch {
    server 127.0.0.1:4080;
}

server {
    listen 7860;
    server_name _;

    client_max_body_size 10M;

    # ─── Health Check ────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://eesha-flask/health;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # ─── Autocomplete API (our OWN index) ───────────────────────────────
    location = /suggest {
        proxy_pass http://eesha-flask/suggest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    # ─── Browser-as-Crawler Submission API (Phase 4) ──────────────────
    location = /submit {
        proxy_pass http://eesha-flask/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type';
    }

    # ─── Spell Check API (Phase 3) ──────────────────────────────────────
    location = /spellcheck {
        proxy_pass http://eesha-flask/spellcheck;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    # ─── OpenSearch Description (browser integration) ───────────────────
    location = /opensearch.xml {
        proxy_pass http://eesha-flask/opensearch.xml;
        proxy_set_header Host $host;
    }

    # ─── Eesha Search UI & API (Flask app) ─────────────────────────────
    location / {
        proxy_pass http://eesha-flask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ─── ZincSearch API (internal/admin) ────────────────────────────────
    # Note: ZincSearch requires Basic Auth — admin should access via port 4080 directly
    location /zincsearch/ {
        proxy_pass http://zincsearch/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
