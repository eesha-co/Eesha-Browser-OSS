[supervisord]
nodaemon=false
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Eesha Search — 100% Independent Search Engine
# Supervisor manages long-running processes that need auto-restart.
# ZincSearch is started by the entrypoint script (single Go binary).
# Only our OWN crawled/indexed data — no external search engines.
# NO SearXNG — replaced with custom Flask search UI & API.

[program:zincsearch]
command=/opt/zincsearch-bin/zincsearch
user=root
directory=/opt/zincsearch-bin
environment=ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",ZINC_DATA_PATH="/data"
autostart=false
autorestart=true
stdout_logfile=/var/log/eesha/zincsearch.log
stderr_logfile=/var/log/eesha/zincsearch-error.log
priority=10

[program:eesha-flask]
command=python3 /opt/eesha/app.py
user=root
directory=/opt/eesha
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",ZINC_SEARCH_URL="%(ENV_ZINC_SEARCH_URL)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s",PORT="8888"
autostart=false
autorestart=true
stdout_logfile=/var/log/supervisor/eesha-flask.log
stderr_logfile=/var/log/supervisor/eesha-flask-error.log
priority=50

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=false
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
priority=90

[program:lightweight-crawler]
command=python3 /opt/eesha-scripts/lightweight_crawler.py
user=root
directory=/opt/eesha-scripts
environment=OPENSEARCH_URL="%(ENV_OPENSEARCH_URL)s",ZINC_FIRST_ADMIN_USER="%(ENV_ZINC_FIRST_ADMIN_USER)s",ZINC_FIRST_ADMIN_PASSWORD="%(ENV_ZINC_FIRST_ADMIN_PASSWORD)s"
autostart=false
autorestart=true
stdout_logfile=/var/log/eesha/crawl.log
stderr_logfile=/var/log/eesha/crawl-error.log
priority=100
