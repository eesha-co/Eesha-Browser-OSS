<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<style>
    :root {
        --body-bg: {COLOR}
        --card-bg: {COLOR}
        --text-primary: {COLOR}
        --accent: #FF6B6B
        --accent-soft: rgba(255,107,107,0.10)
        --accent-medium: rgba(255,107,107,0.18)
        --divider: rgba(128,128,128,0.08)
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04)
        --shadow-md: 0 2px 8px rgba(0,0,0,0.06)
        --shadow-lg: 0 4px 16px rgba(0,0,0,0.08)
        --text-secondary: rgba(0,0,0,0.45)
        --text-tertiary: rgba(0,0,0,0.30)
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        background: var(--body-bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
        padding: 20px 20px 0;
        position: sticky;
        top: 0;
        background: var(--body-bg);
        z-index: 100;
    }

    .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .brand-logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #FFB4B4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: white;
        letter-spacing: -0.5px;
    }

    .brand-name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .greeting-section {
        margin-bottom: 16px;
    }

    .greeting {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.8px;
        line-height: 1.15;
    }

    .greeting-date {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
        margin-top: 4px;
    }

    /* ── Search Bar ── */
    .search-container {
        position: relative;
        margin-bottom: 16px;
    }

    .search-bar {
        display: flex;
        align-items: center;
        background: var(--card-bg);
        border-radius: 16px;
        padding: 0 16px;
        height: 52px;
        box-shadow: var(--shadow-md);
        border: 1.5px solid var(--divider);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-bar:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
    }

    .search-icon {
        width: 20px;
        height: 20px;
        margin-right: 12px;
        opacity: 0.35;
        flex-shrink: 0;
    }

    .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 15px;
        background: transparent;
        color: var(--text-primary);
        font-family: inherit;
        font-weight: 500;
    }

    .search-bar input::placeholder {
        color: var(--text-tertiary);
        font-weight: 400;
    }

    /* ── Category Tabs ── */
    .tabs-container {
        padding: 0 20px;
        margin-bottom: 4px;
    }

    .tabs-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .tabs-scroll::-webkit-scrollbar { display: none; }

    .tabs {
        display: flex;
        gap: 6px;
        list-style: none;
        padding-bottom: 12px;
    }

    .tab {
        padding: 7px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        border: 1.5px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        -webkit-user-select: none;
        user-select: none;
        letter-spacing: -0.1px;
    }

    .tab.active {
        background: var(--text-primary);
        color: var(--body-bg);
        border-color: var(--text-primary);
    }

    .tab:not(.active):active {
        background: var(--accent-soft);
        color: var(--accent);
    }

    /* ── Content ── */
    .content {
        padding: 4px 20px 100px;
    }

    /* ── Featured Card ── */
    .featured-card {
        display: block;
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 14px;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--shadow-md);
        -webkit-user-select: none;
        transition: transform 0.15s;
        animation: fadeSlideUp 0.35s ease-out;
    }

    .featured-card:active {
        transform: scale(0.98);
    }

    .featured-image-wrap {
        position: relative;
        width: 100%;
        height: 200px;
        overflow: hidden;
        background: linear-gradient(135deg, var(--accent-soft), var(--card-bg));
    }

    .featured-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .featured-gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: linear-gradient(transparent, rgba(0,0,0,0.55));
    }

    .featured-content {
        padding: 14px 16px 16px;
        background: var(--card-bg);
    }

    .featured-source {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 6px;
    }

    .featured-source::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
    }

    .featured-title {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .featured-meta {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
    }

    /* ── News Card ── */
    .news-card {
        display: flex;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid var(--divider);
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        -webkit-user-select: none;
        transition: background 0.12s;
        animation: fadeSlideUp 0.35s ease-out;
    }

    .news-card:active {
        background: var(--accent-soft);
        margin: 0 -12px;
        padding-left: 12px;
        padding-right: 12px;
        border-radius: 12px;
    }

    .news-card-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .news-source {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .news-title {
        font-size: 14.5px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.15px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 6px;
    }

    .news-meta {
        font-size: 11.5px;
        color: var(--text-secondary);
        font-weight: 500;
    }

    .news-thumb-wrap {
        width: 100px;
        height: 76px;
        border-radius: 12px;
        overflow: hidden;
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--accent-soft), var(--card-bg));
    }

    .news-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* ── Loading State (Skeleton Shimmer) ── */
    .loading-state {
        padding: 8px 0;
    }

    .skeleton {
        border-radius: 8px;
        background: linear-gradient(90deg, var(--divider) 25%, var(--card-bg) 50%, var(--divider) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
    }

    .skeleton-featured {
        height: 220px;
        border-radius: 18px;
        margin-bottom: 14px;
    }

    .skeleton-card {
        display: flex;
        gap: 14px;
        padding: 14px 0;
    }

    .skeleton-text {
        flex: 1;
    }

    .skeleton-line {
        height: 12px;
        margin-bottom: 8px;
        border-radius: 6px;
    }

    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }
    .skeleton-line.long { width: 95%; }

    .skeleton-thumb {
        width: 100px;
        height: 76px;
        border-radius: 12px;
        flex-shrink: 0;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* ── Error State ── */
    .error-state {
        text-align: center;
        padding: 48px 20px;
    }

    .error-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
    }

    .error-icon svg {
        width: 24px;
        height: 24px;
        opacity: 0.6;
    }

    .error-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
    }

    .error-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 20px;
    }

    .retry-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 24px;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        -webkit-user-select: none;
        transition: opacity 0.15s;
    }

    .retry-btn:active { opacity: 0.8; }

    /* ── Animations ── */
    @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>

<body>
<div class="header">
    <div class="header-top">
        <div class="brand">
            <div class="brand-logo">e</div>
            <span class="brand-name">Eesha</span>
        </div>
    </div>

    <div class="greeting-section">
        <div class="greeting" id="greeting">Good morning</div>
        <div class="greeting-date" id="greetingDate">Monday, January 1</div>
    </div>

    <form onsubmit="return search()" class="search-container" autocomplete="off">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="search_input" placeholder="Search the web..."/>
        </div>
    </form>

    <div class="tabs-container">
        <div class="tabs-scroll">
            <ul class="tabs" id="tabs">
                <li class="tab active" data-category="top">For You</li>
                <li class="tab" data-category="politics">Politics</li>
                <li class="tab" data-category="education">Education</li>
                <li class="tab" data-category="sports">Sports</li>
                <li class="tab" data-category="tech">Technology</li>
                <li class="tab" data-category="business">Business</li>
                <li class="tab" data-category="entertainment">Entertainment</li>
                <li class="tab" data-category="health">Health</li>
                <li class="tab" data-category="science">Science</li>
            </ul>
        </div>
    </div>
</div>

<div class="content" id="content">
    <div class="loading-state" id="loadingState">
        <div class="skeleton skeleton-featured"></div>
        <div class="skeleton-card">
            <div class="skeleton-text">
                <div class="skeleton skeleton-line short"></div>
                <div class="skeleton skeleton-line long"></div>
                <div class="skeleton skeleton-line medium"></div>
            </div>
            <div class="skeleton skeleton-thumb"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-text">
                <div class="skeleton skeleton-line short"></div>
                <div class="skeleton skeleton-line long"></div>
                <div class="skeleton skeleton-line medium"></div>
            </div>
            <div class="skeleton skeleton-thumb"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-text">
                <div class="skeleton skeleton-line short"></div>
                <div class="skeleton skeleton-line long"></div>
                <div class="skeleton skeleton-line medium"></div>
            </div>
            <div class="skeleton skeleton-thumb"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // Search engine URL (set by Kotlin) — used ONLY for search queries
    var BASE_URL = "${BASE_URL}";

    // Pre-fetched "For You" news data injected by Kotlin.
    // No XHR needed — data is already here!
    var INITIAL_NEWS = ${NEWS_DATA};

    var currentCategory = "top";
    var newsCache = {};
    var bridgeTimeout = null;

    // Cache the initial data
    if (INITIAL_NEWS && INITIAL_NEWS.length > 0) {
        newsCache["top"] = INITIAL_NEWS;
    }

    // ── Search ──
    function search() {
        var q = document.getElementById("search_input").value.trim();
        if (q !== "") {
            // Navigate to SearXNG for search — it's just a search engine backend
            window.location.href = BASE_URL + encodeURIComponent(q);
        }
        return false;
    }

    // ── Greeting ──
    function updateGreeting() {
        var hour = new Date().getHours();
        var greeting = "Good evening";
        if (hour < 12) greeting = "Good morning";
        else if (hour < 17) greeting = "Good afternoon";

        var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        var d = new Date();
        var dateStr = days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();

        document.getElementById("greeting").textContent = greeting;
        document.getElementById("greetingDate").textContent = dateStr;
    }

    // ── Time ago ──
    function timeAgo(dateStr) {
        try {
            var d = new Date(dateStr);
            var now = new Date();
            var diff = Math.floor((now - d) / 1000);
            if (diff < 60) return "Just now";
            if (diff < 3600) return Math.floor(diff / 60) + "m ago";
            if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
            if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
            return d.toLocaleDateString();
        } catch(e) {
            return "";
        }
    }

    // ── Escape HTML ──
    function esc(str) {
        var d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    // ── Render News ──
    function renderNews(articles) {
        var container = document.getElementById("content");

        if (!articles || articles.length === 0) {
            container.innerHTML =
                '<div class="error-state">' +
                '<div class="error-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
                '<path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>' +
                '<div class="error-title">No stories right now</div>' +
                '<div class="error-subtitle">Check your connection and try again</div>' +
                '<button class="retry-btn" onclick="retryCategory()">&#8635; Retry</button>' +
                '</div>';
            return;
        }

        // Deduplicate by title
        var seen = {};
        var unique = [];
        articles.forEach(function(a) {
            if (!seen[a.title] && a.title.length > 10) {
                seen[a.title] = true;
                unique.push(a);
            }
        });
        articles = unique.slice(0, 20);

        var html = "";

        // Featured card (first article with image)
        var featured = articles.find(function(a) { return a.image && a.image.length > 0; });
        if (featured) {
            html += '<a class="featured-card" href="' + esc(featured.link) + '">' +
                '<div class="featured-image-wrap">' +
                '<img class="featured-image" src="' + esc(featured.image) + '" onerror="this.parentElement.style.display=\'none\'" alt=""/>' +
                '<div class="featured-gradient"></div>' +
                '</div>' +
                '<div class="featured-content">' +
                '<div class="featured-source">' + esc(featured.source) + '</div>' +
                '<div class="featured-title">' + esc(featured.title) + '</div>' +
                '<div class="featured-meta">' + timeAgo(featured.date) + '</div>' +
                '</div></a>';
            articles = articles.filter(function(a) { return a.title !== featured.title; });
        }

        // Remaining articles
        articles.forEach(function(a) {
            var imgHtml = "";
            if (a.image && a.image.length > 0) {
                imgHtml = '<div class="news-thumb-wrap">' +
                    '<img class="news-thumb" src="' + esc(a.image) + '" onerror="this.parentElement.style.display=\'none\'" alt=""/>' +
                    '</div>';
            }
            html += '<a class="news-card" href="' + esc(a.link) + '">' +
                '<div class="news-card-text">' +
                '<div class="news-source">' + esc(a.source) + '</div>' +
                '<div class="news-title">' + esc(a.title) + '</div>' +
                '<div class="news-meta">' + timeAgo(a.date) + '</div>' +
                '</div>' + imgHtml + '</a>';
        });

        container.innerHTML = html;
    }

    // ── Skeleton Loading ──
    function showLoading() {
        document.getElementById("content").innerHTML =
            '<div class="loading-state">' +
            '<div class="skeleton skeleton-featured"></div>' +
            '<div class="skeleton-card"><div class="skeleton-text">' +
            '<div class="skeleton skeleton-line short"></div>' +
            '<div class="skeleton skeleton-line long"></div>' +
            '<div class="skeleton skeleton-line medium"></div>' +
            '</div><div class="skeleton skeleton-thumb"></div></div>' +
            '<div class="skeleton-card"><div class="skeleton-text">' +
            '<div class="skeleton skeleton-line short"></div>' +
            '<div class="skeleton skeleton-line long"></div>' +
            '<div class="skeleton skeleton-line medium"></div>' +
            '</div><div class="skeleton skeleton-thumb"></div></div>' +
            '</div>';
    }

    // ── Load Category ──
    function loadCategory(category) {
        currentCategory = category;

        // Clear any pending timeout
        if (bridgeTimeout) { clearTimeout(bridgeTimeout); bridgeTimeout = null; }

        // Return cached data if available
        if (newsCache[category]) {
            renderNews(newsCache[category]);
            return;
        }

        showLoading();

        // Use Kotlin NewsBridge for fetching — no XHR, no CORS issues!
        if (window.EeshaNews && typeof window.EeshaNews.fetchCategory === "function") {
            window.EeshaNews.fetchCategory(category);

            // Timeout fallback: if NewsBridge doesn't respond in 15s, show error
            bridgeTimeout = setTimeout(function() {
                bridgeTimeout = null;
                if (newsCache[category]) return; // already loaded
                console.log("Eesha: NewsBridge timeout for category: " + category);
                renderNews([]);
            }, 15000);
        } else {
            // No bridge available — show error immediately
            console.log("Eesha: NewsBridge not available");
            renderNews([]);
        }
    }

    // ── Retry current category ──
    function retryCategory() {
        // Clear cache for this category so it fetches fresh
        delete newsCache[currentCategory];
        loadCategory(currentCategory);
    }

    // ── Callback from Kotlin NewsBridge (success) ──
    window.__onNewsData = function(category, data) {
        if (bridgeTimeout) { clearTimeout(bridgeTimeout); bridgeTimeout = null; }
        if (data && data.length > 0) {
            newsCache[category] = data;
        }
        if (category === currentCategory) {
            renderNews(data);
        }
    };

    // ── Callback from Kotlin NewsBridge (error) ──
    window.__onNewsError = function(category) {
        if (bridgeTimeout) { clearTimeout(bridgeTimeout); bridgeTimeout = null; }
        if (category === currentCategory) {
            renderNews([]);
        }
    };

    // ── Tab click handling ──
    document.getElementById("tabs").addEventListener("click", function(e) {
        if (e.target && e.target.classList.contains("tab")) {
            document.querySelectorAll(".tab").forEach(function(t) {
                t.classList.remove("active");
            });
            e.target.classList.add("active");
            loadCategory(e.target.getAttribute("data-category"));
        }
    });

    // ── Initialize ──
    updateGreeting();

    // Render pre-loaded "For You" news immediately
    if (INITIAL_NEWS && INITIAL_NEWS.length > 0) {
        renderNews(INITIAL_NEWS);
    } else {
        loadCategory("top");
    }
</script>
</body>
</html>
