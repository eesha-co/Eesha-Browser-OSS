<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:;">
  <title>Eesha Browser Chrome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-chrome">
    <!-- Tab Bar -->
    <div class="tab-bar" id="tabBar">
      <div class="tabs-container" id="tabsContainer">
        <!-- Tabs will be dynamically created here -->
      </div>
      <button class="new-tab-btn" id="newTabBtn" title="New Tab (Ctrl+T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="new-tab-btn private-tab-btn" id="privateTabBtn" title="New Private Tab (Ctrl+Shift+P)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <!-- Window controls (for frameless window on Windows/Linux) -->
      <div class="window-controls" id="windowControls">
        <button class="window-btn minimize-btn" id="minimizeBtn">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1" fill="currentColor"/></svg>
        </button>
        <button class="window-btn maximize-btn" id="maximizeBtn">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="window-btn close-btn" id="closeBtn">
          <svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.2"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>

    <!-- URL Bar -->
    <div class="url-bar-container">
      <div class="nav-buttons">
        <button class="nav-btn" id="backBtn" title="Back (Alt+Left)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="forwardBtn" title="Forward (Alt+Right)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="reloadBtn" title="Reload (Ctrl+R)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="nav-btn" id="homeBtn" title="Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </div>

      <div class="url-input-wrapper" id="urlInputWrapper">
        <!-- Shield icon for tracker blocking -->
        <div class="shield-icon" id="shieldIcon" title="Privacy protection">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span class="shield-badge" id="shieldBadge">0</span>
        </div>
        <div class="security-indicator" id="securityIndicator">
          <svg class="icon-lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <svg class="icon-info" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </div>
        <input
          type="text"
          class="url-input"
          id="urlInput"
          placeholder="Search with Eesha Search or enter a URL..."
          autocomplete="off"
          spellcheck="false"
        />
        <!-- Autocomplete dropdown -->
        <div class="autocomplete-dropdown" id="autocompleteDropdown">
          <!-- Suggestions will be injected here -->
        </div>
      </div>

      <div class="action-buttons">
        <button class="nav-btn" id="bookmarkBtn" title="Bookmark (Ctrl+D)">
          <svg class="icon-bookmark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <svg class="icon-bookmark-filled" width="16" height="16" viewBox="0 0 24 24" fill="#e94560" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button class="nav-btn" id="downloadsBtn" title="Downloads (Ctrl+J)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="download-badge" id="downloadBadge" style="display:none"></span>
        </button>
        <button class="nav-btn" id="shareBtn" title="Copy URL to clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>
        <button class="nav-btn" id="settingsBtn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Find Bar -->
    <div class="find-bar" id="findBar" style="display:none">
      <input type="text" id="findInput" class="find-input" placeholder="Find in page..." autocomplete="off">
      <span class="find-count" id="findCount">0/0</span>
      <button class="find-btn" id="findPrevBtn" title="Previous (Shift+Enter)">▲</button>
      <button class="find-btn" id="findNextBtn" title="Next (Enter)">▼</button>
      <button class="find-btn find-close-btn" id="findCloseBtn" title="Close (Esc)">✕</button>
    </div>

    <!-- Loading Progress Bar -->
    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Shield details popup -->
  <div class="shield-popup" id="shieldPopup">
    <div class="shield-popup-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Privacy Protection</span>
    </div>
    <div class="shield-popup-content">
      <div class="shield-popup-item">
        <span class="shield-popup-label">Trackers blocked</span>
        <span class="shield-popup-value" id="popupBlockedCount">0</span>
      </div>
      <div class="shield-popup-item">
        <span class="shield-popup-label">Fingerprint protection</span>
        <span class="shield-popup-value" id="popupFingerprint">On</span>
      </div>
      <div class="shield-popup-item">
        <span class="shield-popup-label">HTTPS-only mode</span>
        <span class="shield-popup-value" id="popupHttps">On</span>
      </div>
      <div class="shield-popup-item">
        <span class="shield-popup-label">Connection</span>
        <span class="shield-popup-value" id="popupConnection">—</span>
      </div>
    </div>
    <div class="shield-popup-footer">
      <button class="shield-popup-btn" id="shieldSettingsBtn">Privacy Settings</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
