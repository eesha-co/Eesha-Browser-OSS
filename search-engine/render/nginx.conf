# Eesha Search v3.0 — 100% Independent Search Engine
# Nginx Reverse Proxy for Render.com
# External port: ${EXTERNAL_PORT} (templated via envsubst/sed in entrypoint)
# Internal: Flask app (8888) + ZincSearch (4080, localhost only)
# Only Flask is proxied — ZincSearch is NOT exposed externally
# NEW: /zinc-api/ provides authenticated ZincSearch access for Crawler Instance

upstream eesha-flask {
    server 127.0.0.1:8888;
}

# API key validation map — only allow requests with the correct key
map $http_x_eesha_api_key $zinc_api_allowed {
    default 0;
    "${EESHA_API_KEY}" 1;
}

server {
    listen ${EXTERNAL_PORT};
    server_name _;

    client_max_body_size 50M;

    # ─── Health Check ────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://eesha-flask/health;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # ─── Autocomplete API (our OWN index) ───────────────────────────────
    location = /suggest {
        proxy_pass http://eesha-flask/suggest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    # ─── Browser-as-Crawler Submission API ──────────────────────────────
    location = /submit {
        proxy_pass http://eesha-flask/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type';
    }

    # ─── Spell Check API ────────────────────────────────────────────────
    location = /spellcheck {
        proxy_pass http://eesha-flask/spellcheck;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    }

    # ─── OpenSearch Description (browser integration) ───────────────────
    location = /opensearch.xml {
        proxy_pass http://eesha-flask/opensearch.xml;
        proxy_set_header Host $host;
    }

    # ─── Crawler Instance API (authenticated) ──────────────────────────
    location /api/ {
        proxy_pass http://eesha-flask/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type, X-Eesha-API-Key';
    }

    # ─── ZincSearch Direct Proxy (API key protected, for Crawler) ──────
    # Crawler Instance uses this to index documents directly.
    # Requires X-Eesha-API-Key header matching EESHA_API_KEY env var.
    location /zinc-api/ {
        if ($zinc_api_allowed = 0) {
            return 401 '{"error":"Unauthorized: Invalid or missing API key"}';
        }
        rewrite ^/zinc-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:4080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Eesha Search UI & API (Flask app) ─────────────────────────────
    location / {
        proxy_pass http://eesha-flask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ─── Block direct ZincSearch access ─────────────────────────────────
    # ZincSearch is bound to 127.0.0.1 — this location just in case
    location /zincsearch/ {
        return 403;
    }
}
